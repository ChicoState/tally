name: Build

on:
  push:
    branches: "*"
  pull_request:
    branches: "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compile program
        run: g++ main.cpp --std=c++17 -o tally
